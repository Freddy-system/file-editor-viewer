id = "file-editor-viewer"
name = "File Editor & Viewer"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "View and edit files in a pane: Markdown with Mermaid, Graphviz and LaTeX, source code, images. Built-in editor"
platforms = ["linux", "macos"]

# Downloads the prebuilt binary of this release, or builds it with cargo when
# there is none for the platform.
[[build]]
command = ["sh", "scripts/install.sh"]

# The viewer. Opened by the actions below, which tell it what to show;
# opened directly it shows the focused pane's README or a file picker.
[[panes]]
id = "preview"
title = "Files"
placement = "split"
command = ["target/release/fev", "herdr", "pane"]

[[actions]]
id = "open"
title = "View or edit a file (split)"
contexts = ["workspace"]
command = ["target/release/fev", "herdr", "open", "--placement", "split"]

[[actions]]
id = "open-tab"
title = "View or edit a file (new tab)"
contexts = ["workspace"]
command = ["target/release/fev", "herdr", "open", "--placement", "tab"]

[[actions]]
id = "open-overlay"
title = "View or edit a file (overlay)"
contexts = ["workspace"]
command = ["target/release/fev", "herdr", "open", "--placement", "overlay"]

# Ctrl-click a link to a local file to open it here. Web links are left to
# the browser.
[[link_handlers]]
id = "local-file"
title = "Open local file"
pattern = "(?i)^file://.+"
action = "open"

[[link_handlers]]
id = "markdown-file"
title = "Open Markdown file"
pattern = "(?i)^(file://)?[^:]*\\.(md|markdown|mdx|mdown|mkd)(#[^#]*)?$"
action = "open"
