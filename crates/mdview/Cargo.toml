[package]
name = "mdview"
description = "Markdown previewer: herdr plugin, terminal viewer and browser preview"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mdview"
path = "src/main.rs"

[dependencies]
mdview-core.workspace = true
mdview-render.workspace = true
mdview-tui.workspace = true
mdview-web.workspace = true
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
