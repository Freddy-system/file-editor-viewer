[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "MIT"
authors = ["Freddy Sedano"]
repository = "https://github.com/Freddy-system/file-editor-viewer"
rust-version = "1.92"

[workspace.dependencies]
fev-core = { path = "crates/fev-core" }
fev-render = { path = "crates/fev-render" }
fev-tui = { path = "crates/fev-tui" }
fev-web = { path = "crates/fev-web" }
anyhow = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
